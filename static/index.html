<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kairos — seize the moment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070810; --bg2:#0c0e18;
  --surface:rgba(22,25,38,.6); --surface-line:rgba(255,255,255,.07);
  --text:#eceefb; --muted:#8b90a8;
  --v:#7c5cff; --c:#22d3ee; --grad:linear-gradient(120deg,#7c5cff,#22d3ee);
  --ok:#34d399; --bad:#fb7185; --warn:#fbbf24;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:Inter,system-ui,sans-serif; color:var(--text);
  background:
    radial-gradient(900px 500px at 78% -8%, rgba(124,92,255,.18), transparent 60%),
    radial-gradient(800px 500px at 12% 8%, rgba(34,211,238,.12), transparent 55%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed; min-height:100vh; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px; margin:0 auto; padding:40px 22px 80px}

/* header */
.brand{display:flex; align-items:center; gap:14px; margin-bottom:6px}
.mark{width:42px; height:42px; border-radius:12px; background:var(--grad);
  display:grid; place-items:center; box-shadow:0 8px 30px rgba(124,92,255,.45); flex:0 0 auto}
.mark svg{width:24px; height:24px}
.brand h1{font-size:26px; font-weight:700; letter-spacing:-.02em; margin:0}
.brand .sub{color:var(--muted); font-size:13.5px; margin-top:1px}
.dotline{height:1px; background:linear-gradient(90deg,transparent,var(--surface-line),transparent); margin:24px 0}

/* cards */
.card{background:var(--surface); border:1px solid var(--surface-line); border-radius:var(--r);
  padding:20px; margin:16px 0; backdrop-filter:blur(14px); position:relative; overflow:hidden}
.card::before{content:""; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}
.step{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.step .n{width:24px; height:24px; border-radius:7px; font-size:12.5px; font-weight:700;
  display:grid; place-items:center; background:rgba(124,92,255,.16); color:#c9bcff;
  border:1px solid rgba(124,92,255,.3)}
.step h2{font-size:14px; font-weight:600; margin:0; letter-spacing:.01em}
.step .hint{color:var(--muted); font-size:12.5px; margin-left:auto}

/* form */
label{display:block; font-size:12px; color:var(--muted); margin:12px 0 5px; font-weight:500}
input{width:100%; background:rgba(8,10,18,.7); border:1px solid var(--surface-line);
  color:var(--text); padding:11px 13px; border-radius:10px; font:inherit; transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#4b4f63}
input:focus{outline:none; border-color:rgba(124,92,255,.6); box-shadow:0 0 0 3px rgba(124,92,255,.15)}
.row{display:flex; gap:12px} .row>div{flex:1}

/* buttons */
button{font:inherit; font-weight:600; border:0; border-radius:10px; cursor:pointer;
  padding:11px 18px; transition:transform .12s, filter .15s, opacity .15s}
button:active{transform:translateY(1px)}
.btn-primary{background:var(--grad); color:#0a0a12; box-shadow:0 8px 24px rgba(124,92,255,.35)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:rgba(255,255,255,.05); color:var(--text); border:1px solid var(--surface-line)}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
button:disabled{opacity:.45; cursor:not-allowed; filter:grayscale(.4); box-shadow:none}
.btn-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:16px}

/* pills */
.pill{display:inline-flex; align-items:center; gap:7px; padding:5px 11px; border-radius:99px;
  font-size:12.5px; font-weight:600}
.pill .dot{width:7px; height:7px; border-radius:99px; background:currentColor}
.pill.ok{background:rgba(52,211,153,.14); color:var(--ok)}
.pill.bad{background:rgba(251,113,133,.14); color:var(--bad)}
.pill.wait{background:rgba(251,191,36,.14); color:var(--warn)}
.pill.idle{background:rgba(139,144,168,.14); color:var(--muted)}

/* login code */
.codebox{margin-top:14px; padding:14px 16px; border-radius:12px; border:1px dashed rgba(124,92,255,.4);
  background:rgba(124,92,255,.07); display:none}
.codebox.show{display:block}
.codebox .lbl{font-size:12px; color:var(--muted)}
.code{font:700 30px/1 'JetBrains Mono',monospace; letter-spacing:4px; color:#fff; margin:8px 0;
  display:flex; align-items:center; gap:12px}
.code button{padding:6px 10px; font-size:12px}

/* countdown */
.count-wrap{display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0 4px}
.count-label{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.12em}
.count{font:700 clamp(40px,12vw,64px)/1 'JetBrains Mono',monospace;
  background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;
  letter-spacing:-.01em}
.count.idle{background:none; color:#2c3047; -webkit-text-fill-color:#2c3047}

/* log */
.log{margin-top:14px; background:#05060c; border:1px solid var(--surface-line); border-radius:12px;
  padding:12px 14px; height:230px; overflow-y:auto; font:12px/1.7 'JetBrains Mono',monospace;
  color:#aeb4cc; white-space:pre-wrap; word-break:break-word}
.log:empty::after{content:"waiting for run…"; color:#3a3e52}
.log::-webkit-scrollbar{width:8px} .log::-webkit-scrollbar-thumb{background:#1c2030; border-radius:8px}

/* sse indicator + footer */
.sse{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted)}
.sse .dot{width:7px;height:7px;border-radius:99px;background:var(--bad); box-shadow:0 0 8px var(--bad)}
.sse.live .dot{background:var(--ok); box-shadow:0 0 8px var(--ok)}
.foot{margin-top:28px; text-align:center; color:#454a60; font-size:11.5px}
.foot a{color:#6b7090}
a{color:#9db6ff}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0a0a12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="13" r="8"/><path d="M12 13V8.5"/><path d="M12 13l3 2"/><path d="M9 2h6"/>
      </svg>
    </div>
    <div>
      <h1>Kairos</h1>
      <div class="sub">Seize the moment a name drops.</div>
    </div>
    <div style="margin-left:auto"><span class="sse" id="sse"><span class="dot"></span>live</span></div>
  </div>
  <div class="dotline"></div>

  <!-- 1 · Account -->
  <div class="card">
    <div class="step"><span class="n">1</span><h2>Account</h2>
      <span class="hint" id="loginPill"><span class="pill idle"><span class="dot"></span>not connected</span></span>
    </div>
    <div class="codebox" id="codebox">
      <div class="lbl">Open <a id="verifyLink" target="_blank" rel="noopener"></a> and enter:</div>
      <div class="code"><span id="code"></span><button class="btn-ghost" id="copyCode">copy</button></div>
      <div class="lbl">Waiting for you to finish in the browser…</div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="loginBtn">Connect Microsoft account</button>
    </div>
  </div>

  <!-- 2 · Target -->
  <div class="card">
    <div class="step"><span class="n">2</span><h2>Target</h2>
      <span class="hint">the name you want to claim</span>
    </div>
    <label>Username</label>
    <input id="target" placeholder="DreamWasTaken" autocomplete="off" spellcheck="false">
    <label>Drop time — ISO 8601, UTC</label>
    <input id="drop" placeholder="2026-07-01T15:00:00" autocomplete="off" spellcheck="false">
    <div class="row">
      <div><label>Burst start (s before)</label><input id="burst" value="2"></div>
      <div><label>Concurrent PUTs</label><input id="concurrent" value="20"></div>
      <div><label>Poll interval (ms)</label><input id="poll" value="500"></div>
    </div>
    <div class="btn-row">
      <button class="btn-ghost" id="nameMcBtn">Check on NameMC ↗</button>
      <span style="color:var(--muted); font-size:12px">unsure of the exact name? look it up</span>
    </div>
  </div>

  <!-- 3 · Run -->
  <div class="card">
    <div class="step"><span class="n">3</span><h2>Run</h2>
      <span class="hint" id="resultPill"></span>
    </div>
    <div class="count-wrap">
      <div class="count-label">drop in</div>
      <div class="count idle" id="count">--:--:--</div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="startBtn" disabled>Run sniper</button>
    </div>
    <div class="log" id="log"></div>
  </div>

  <div class="foot">Kairos · runs against your own Minecraft account · <a href="https://namemc.com" target="_blank" rel="noopener">namemc</a></div>
</div>

<script>
const $ = id => document.getElementById(id);
const logEl = $("log");
function addLog(t){ logEl.textContent += t + "\n"; logEl.scrollTop = logEl.scrollHeight; }
function pill(cls, txt){ return `<span class="pill ${cls}"><span class="dot"></span>${txt}</span>`; }

async function refreshStatus(){
  let s;
  try { s = await (await fetch("/api/status")).json(); } catch { return; }
  const L = s.login || {};
  if (L.status === "done"){
    $("loginPill").innerHTML = pill("ok", "connected · " + (L.profile || "no profile"));
    $("codebox").classList.remove("show");
    $("loginBtn").style.display = "none";
    $("startBtn").disabled = s.running;
  } else if (L.status === "pending"){
    $("loginPill").innerHTML = pill("wait", "waiting for sign-in");
    $("codebox").classList.add("show");
    $("verifyLink").textContent = L.verification_uri;
    $("verifyLink").href = L.verification_uri;
    $("code").textContent = L.user_code;
    setTimeout(refreshStatus, 2500);
  } else if (L.status === "error"){
    $("loginPill").innerHTML = pill("bad", "login failed");
    addLog("login error: " + L.error);
    $("loginBtn").style.display = "inline-block";
    $("loginBtn").disabled = false;
  }
}

$("loginBtn").onclick = async () => {
  $("loginBtn").disabled = true;
  $("loginPill").innerHTML = pill("wait", "connecting…");
  try { await fetch("/api/login", {method:"POST"}); } catch {}
  refreshStatus();
};

$("copyCode").onclick = () => {
  navigator.clipboard?.writeText($("code").textContent.trim());
  $("copyCode").textContent = "copied";
  setTimeout(() => $("copyCode").textContent = "copy", 1200);
};

$("nameMcBtn").onclick = () => {
  const n = $("target").value.trim();
  window.open("https://namemc.com/search?q=" + encodeURIComponent(n), "_blank");
};

$("startBtn").onclick = async () => {
  const body = {
    target: $("target").value.trim(),
    drop_time: $("drop").value.trim(),
    burst_s: $("burst").value,
    concurrent: $("concurrent").value,
    poll_ms: $("poll").value,
  };
  if (!body.target || !body.drop_time){ alert("Need a target name and drop time."); return; }
  $("resultPill").innerHTML = ""; logEl.textContent = "";
  let r;
  try { r = await fetch("/api/start", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}); }
  catch { alert("server unreachable"); return; }
  if (!r.ok){ alert((await r.json()).error); return; }
  $("startBtn").disabled = true;
};

// live event stream
const es = new EventSource("/api/events");
es.onopen = () => $("sse").classList.add("live");
es.onerror = () => $("sse").classList.remove("live");
es.onmessage = (e) => {
  const ev = JSON.parse(e.data);
  if (ev.type === "log") addLog(ev.msg);
  else if (ev.type === "countdown"){
    $("count").classList.remove("idle");
    $("count").textContent = ev.label;
  } else if (ev.type === "done"){
    $("count").classList.add("idle");
    $("count").textContent = "--:--:--";
    $("startBtn").disabled = false;
    if (ev.claimed) $("resultPill").innerHTML = pill("ok", "CLAIMED · " + ev.name);
    else $("resultPill").innerHTML = pill("bad", "not claimed" + (ev.error ? " · " + ev.error : ""));
  }
};

refreshStatus();
</script>
</body>
</html>
